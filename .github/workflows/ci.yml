name: Verify Projeto Turbo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node --check scripts/setup-cloud.mjs
      - run: npm run setup:local
      - run: timeout 95s npm run smoke:local
